version: 1
sources:
  - id: orders-db
    driver: mysql
    dsn: {env: ORDER_DATABASE_DSN}
    budget: {timeout: 5s, max_rows: 1000, max_bytes: 1048576}
channels:
  - id: demo-inbox
    type: local_sink
    url: http://notification-sink:8000/notifications
    token_secret: {env: MON_ADMIN_TOKEN}
    confirm: code_zero
checks:
  - id: order-callback
    source: orders-db
    environment: demo
    mode: entity
    interval: 15s
    query: |
      SELECT order_id, callback_state, retry_count, created_at, updated_at,
             TIMESTAMPDIFF(SECOND, updated_at, UTC_TIMESTAMP(6)) AS age_seconds
      FROM callback_orders
      WHERE updated_at >= :window_start OR callback_state IN ('WAITING_ACK','DEAD_LETTER')
      ORDER BY updated_at, order_id
    detail_query: |
      SELECT order_id, callback_state, retry_count, updated_at
      FROM callback_orders WHERE order_id = :id
    identity: [id]
    fields:
      id: {column: order_id, type: string, required: true}
      state: {column: callback_state, type: string, required: true}
      retries: {column: retry_count, type: int, required: true}
      age_seconds: {column: age_seconds, type: int, required: true}
      created: {column: created_at, type: timestamp, required: true}
      updated: {column: updated_at, type: timestamp, required: true}
    rules:
      - id: callback-failed
        trigger: fields.state == 'DEAD_LETTER'
        recover: fields.state == 'DELIVERED'
        confirmations: 1
        recovery_confirmations: 2
        severity: critical
        summary: 订单回调重试耗尽，等待人工检查
      - id: callback-timeout
        trigger: fields.state == 'WAITING_ACK' && fields.age_seconds > 180
        recover: fields.state == 'DELIVERED'
        confirmations: 2
        recovery_confirmations: 2
        severity: warning
        summary: 订单回调长时间未收到确认
    diagnosis_mode: rule_only
    allow_model: false
    notification_routes: [demo-inbox]
    diagnostic_rules:
      - id: callback-auth
        pattern: '(?i)(401|403|unauthorized|forbidden)'
        category: callback_auth_failure
        summary: 回调接收端拒绝认证或权限不足
        actions: [检查回调认证配置与接收端权限, 由业务负责人确认后重试]
    runbook: 检查回调接收端可用性、认证和重试记录；人工关闭不表示订单已经履约。
