name: Build release images
on:
  workflow_dispatch:
  push:
    tags: ['v2.*']
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Determine repository name
        id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v2.')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v2.') }}
          tags: ghcr.io/${{ steps.repository.outputs.name }}:${{ startsWith(github.ref, 'refs/tags/v2.') && github.ref_name || format('ci-{0}', github.sha) }}
      - name: SSH demonstration target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go
          target: ssh-target
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v2.') }}
          tags: ghcr.io/${{ steps.repository.outputs.name }}-ssh:${{ startsWith(github.ref, 'refs/tags/v2.') && github.ref_name || format('ci-{0}', github.sha) }}
      - name: Demonstration services
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v2.') }}
          tags: ghcr.io/${{ steps.repository.outputs.name }}-demo:${{ startsWith(github.ref, 'refs/tags/v2.') && github.ref_name || format('ci-{0}', github.sha) }}
