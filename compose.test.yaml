# Run with compose.yaml + compose.demo.yaml; all business/system test data is isolated.
services:
  test-postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: [test]
    environment: {POSTGRES_DB: bid_mon_tests, POSTGRES_USER: monitor, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'}
    volumes: [test_system:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U monitor -d bid_mon_tests']
      interval: 3s
      retries: 30
  test-mysql:
    image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    profiles: [test]
    command: [--default-time-zone=+00:00]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: presales_lab
      MYSQL_USER: lab_writer
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONITOR_MYSQL_PASSWORD: ${MONITOR_MYSQL_PASSWORD}
    volumes: [test_business:/var/lib/mysql, ./deploy/mysql:/docker-entrypoint-initdb.d:ro]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -ulab_writer -D presales_lab -e "SELECT 1 FROM callback_orders LIMIT 1" >/dev/null 2>&1']
      interval: 3s
      retries: 40
  go-tests:
    image: bid-mon-go-tests:2.0.0-dev
    profiles: [test]
    networks: [backend]
    environment:
      GO_DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@test-postgres:5432/bid_mon_tests?sslmode=disable
      GO_SOURCE_DSN: monitor_reader:${MONITOR_MYSQL_PASSWORD}@tcp(test-mysql:3306)/presales_lab?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27&timeout=5s&readTimeout=10s&writeTimeout=10s
      GO_LAB_DSN: lab_writer:${MYSQL_PASSWORD}@tcp(test-mysql:3306)/presales_lab?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27
      MON_ADMIN_TOKEN: ${MON_ADMIN_TOKEN}
      MON_SECRET_KEY_FILE: /etc/bid-mon/master.key
      GO_SSH_ADDRESS: ssh-target:22
      MON_EVIDENCE_CONFIG_FILE: /etc/bid-mon/evidence.json
      RUN_GO_INTEGRATION: "1"
      RUN_GO_SSH: "1"
      RUN_GO_PROFILE_SSH: "1"
      RUN_CHECKS_PG_INTEGRATION: "1"
      CHECKS_TEST_POSTGRES_DSN: postgres://monitor:${POSTGRES_PASSWORD}@test-postgres:5432/bid_mon_tests?sslmode=disable
    volumes: [demo_client:/ssh-client:ro, ./deploy/phase2/config:/etc/bid-mon:ro]
    depends_on:
      test-postgres: {condition: service_healthy}
      test-mysql: {condition: service_healthy}
      ssh-target: {condition: service_started}
volumes:
  test_system: {}
  test_business: {}
