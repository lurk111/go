[project]
name = "presales-monitor"
version = "0.1.0"
description = "Local lab for presales task monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "pymysql[rsa]>=1.1,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2",
  "cryptography==50.0.1", "tzdata>=2024.1",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presales_monitor"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
